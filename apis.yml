name: Oyo Rooms
description: >-
  OYO Rooms (Oravel Stays / OYO Hotels & Homes) is a hospitality technology
  company headquartered in Gurugram, India that operates a global chain of
  franchised and leased budget hotels, homes, and living spaces. Founded by
  Ritesh Agarwal in 2013, OYO standardizes and distributes independent hotel
  inventory through its consumer booking apps and website, and provides property
  owners with a partner management platform for listings, pricing, and
  operations. OYO is a consumer travel and accommodation brand; as of this
  enrichment pass it does not publish a public developer portal, API reference,
  or OpenAPI/AsyncAPI specification. This profile was surfaced as a portfolio
  company of Lightspeed Venture Partners.
